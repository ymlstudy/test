version: '3'

services:

  zookeeper-server:
    container_name: zookeeper-container
    image: docker.io/ccxylt/prometheus:zookeeper-v3.7.0 
    restart: always

    ports:
      - "2181:2181"

    volumes:
      - /etc/localtime:/etc/localtime
      - zk-data:/data
      - zk-datalog:/datalog
      - zk-logs:/logs

    networks:
      - kafka-net

  kafka-server:
    container_name: kafka-container
    image: docker.io/ccxylt/prometheus:kafka-2.13-2.8.1 

    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      # 修改成当前主机 IP
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.6.12:9092

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ZOOKEEPER_CONNECT: zookeeper-server:2181

      KAFKA_LOG_DIRS: /kafka/logs

    volumes:
      - /etc/localtime:/etc/localtime
      - kafka-data:/kafka

    depends_on:
      - zookeeper-server

    networks:
      - kafka-net

  kafka-manager:
    container_name: kafka-manager-container
    image: docker.io/ccxylt/prometheus:kafka-manager-latest 

    restart: always

    ports:
      - "9000:9000"

    environment:
      ZK_HOSTS: zookeeper-server:2181

    volumes:
      - /etc/localtime:/etc/localtime

    depends_on:
      - kafka-server

    networks:
      - kafka-net

  kafka-exporter:
    container_name: kafka-exporter-container
    image: docker.io/ccxylt/prometheus:kafka-exporter-v1.7.0

    restart: always

    ports:
      - "9308:9308"

    command:
      - "--kafka.server=192.168.6.12:9092"

    volumes:
      - /etc/localtime:/etc/localtime

    depends_on:
      - kafka-server

    networks:
      - kafka-net

volumes:
  zk-data:
  zk-datalog:
  zk-logs:
  kafka-data:

networks:
  kafka-net:
    driver: bridge
